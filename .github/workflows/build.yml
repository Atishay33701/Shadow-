name: Build SHADOW APK

on:
workflow_dispatch:
push:
branches: ["main"]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.13"

  - name: Check project files
    run: |
      pwd
      ls -la
      find . -maxdepth 3 \( -name "settings.gradle" -o -name "build.gradle" -o -name "gradlew" \) -print

  - name: Build SHADOW APK
   run: |
  echo "=== ROOT DIRECTORY ==="
  pwd
  ls -la
  echo "=== PROJECT FILES ==="
  find . -maxdepth 4 -type f \( -name "settings.gradle" -o -name "build.gradle" -o -name "AndroidManifest.xml" \) -print
  echo "=== GRADLE PROJECTS ==="
  gradle projects
  echo "=== AVAILABLE TASKS ==="
  gradle tasks --all
  
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: SHADOW-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
```
