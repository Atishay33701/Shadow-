plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shadow.ai'
    compileSdk 37

    defaultConfig {
        applicationId 'com.shadow.ai'
        minSdk 24
        targetSdk 37
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
